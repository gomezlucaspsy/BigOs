<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WasmShare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #7dd3fc;
      --accent-dark: #38bdf8;
      --bg: #0d0d14;
      --surface: #16161f;
      --surface2: #1e1e2e;
      --border: #2a2a3d;
      --text: #e2e8f0;
      --muted: #64748b;
      --green: #4ade80;
      --red: #f87171;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
      gap: 0;
    }

    /* ── Header ─────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header #logoBtn { font-size: 2.6rem; line-height: 1; margin-bottom: 0.4rem; }
    header #logoBtn:hover { transform: scale(1.1); }
    header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--accent);
    }
    header p { color: var(--muted); font-size: 0.875rem; margin-top: 0.3rem; }

    /* ── Steps (sender) ─────────────────────── */
    .steps {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 480px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: var(--muted);
      flex: 1;
      justify-content: center;
    }
    .step .num {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.7rem;
      flex-shrink: 0;
      transition: background 0.3s, color 0.3s;
    }
    .step.active .num { background: var(--accent); color: #000; }
    .step.done .num { background: var(--green); color: #000; }
    .step-line { flex: 1; height: 2px; background: var(--border); border-radius: 1px; }
    .step-line.done { background: var(--green); }

    /* ── Card ───────────────────────────────── */
    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      width: 100%;
      max-width: 480px;
    }

    /* ── Drop zone ──────────────────────────── */
    #dropZone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      text-align: center;
    }
    #dropZone:hover, #dropZone.drag-over {
      border-color: var(--accent);
      background: rgba(125, 211, 252, 0.04);
    }
    #dropZone .drop-icon { font-size: 3rem; line-height: 1; }
    #dropZone .drop-title { font-weight: 600; font-size: 1rem; }
    #dropZone .drop-sub { font-size: 0.8rem; color: var(--muted); }
    #fileInput { display: none; }

    /* ── File pill ──────────────────────────── */
    #filePill {
      display: none;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-top: 1rem;
    }
    #filePill .pill-icon { font-size: 1.5rem; flex-shrink: 0; }
    #filePill .pill-info { flex: 1; overflow: hidden; }
    #filePill .pill-name {
      font-weight: 600; font-size: 0.9rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #filePill .pill-size { font-size: 0.75rem; color: var(--muted); }
    #filePill .pill-remove {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 1.1rem; padding: 0.2rem;
      transition: color 0.2s; width: auto; margin: 0;
    }
    #filePill .pill-remove:hover { color: var(--red); }

    /* ── Button ─────────────────────────────── */
    .btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn:hover:not(:disabled) { background: var(--accent-dark); transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { background: var(--border); color: var(--muted); cursor: default; }

    /* ── QR section ─────────────────────────── */
    #qrSection {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    #qrSection .qr-label {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    #qrContainer {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      line-height: 0;
    }
    .qr-actions {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }
    .btn-outline {
      flex: 1;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      margin-top: 0;
      width: auto;
    }
    .btn-outline:hover { border-color: var(--accent); background: rgba(125,211,252,0.06); }
    #qrUrl {
      font-size: 0.7rem;
      color: var(--muted);
      word-break: break-all;
      text-align: center;
      max-height: 2.4em;
      overflow: hidden;
    }

    /* ── Status bar ─────────────────────────── */
    #statusBar {
      width: 100%;
      max-width: 480px;
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #statusMsg {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 1.4em;
    }
    #statusMsg .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    #progressWrap {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      gap: 0.5rem;
      flex-direction: column;
    }
    .progress-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem;
    }
    .progress-label { color: var(--text); font-weight: 600; }
    .progress-pct { color: var(--accent); font-weight: 700; }
    #progressTrack {
      height: 8px;
      border-radius: 4px;
      background: var(--surface);
      overflow: hidden;
    }
    #progressBar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      width: 0%;
      transition: width 0.15s ease;
      border-radius: 4px;
    }
    .progress-speed { font-size: 0.75rem; color: var(--muted); }

    /* ── Download card ──────────────────────── */
    #downloadSection {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 480px;
      margin-top: 1.25rem;
    }
    #downloadSection .card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }
    .dl-icon { font-size: 3rem; }
    .dl-filename { font-weight: 700; font-size: 1.1rem; word-break: break-all; }
    .dl-size { color: var(--muted); font-size: 0.85rem; }
    #downloadLink {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    #downloadLink:hover { background: #22c55e; transform: translateY(-1px); }

    /* ── Receiver waiting ───────────────────── */
    #receiverWaiting {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 480px;
    }
    .spinner {
      width: 56px; height: 56px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .waiting-title { font-size: 1.1rem; font-weight: 700; text-align: center; }
    .waiting-sub { font-size: 0.85rem; color: var(--muted); text-align: center; }

    /* ── Toast ──────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-size: 0.85rem;
      transition: transform 0.3s;
      white-space: nowrap;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <button id="logoBtn" style="background:none;border:none;cursor:pointer;padding:0;font-size:2.6rem;line-height:1;transition:transform 0.2s;" title="Mostrar QR del servidor local">⚡</button>
    <h1>WasmShare</h1>
    <p>Comparte archivos P2P con un QR — sin servidores intermedios</p>
  </header>

  <!-- QR Modal (localhost) -->
  <div id="qrModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;">
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:2rem;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;">
      <h2 style="margin:0;color:var(--accent);font-size:1.2rem;">Escanea desde otro dispositivo</h2>
      <div id="localQrContainer" style="background:#fff;padding:12px;border-radius:12px;line-height:0;"></div>
      <p style="margin:0;font-size:0.85rem;color:var(--muted);" id="localQrUrl"></p>
      <button id="closeQrModal" style="background:var(--border);border:none;color:var(--text);padding:0.6rem 1.2rem;border-radius:8px;cursor:pointer;font-weight:600;">Cerrar</button>
    </div>
  </div>

  <!-- ── SENDER UI ─────────────────────────────────── -->
  <div id="senderUI" style="width:100%;max-width:480px;display:flex;flex-direction:column;gap:0;">

    <!-- Step indicator -->
    <div class="steps" id="stepsRow">
      <div class="step active" id="step1"><div class="num">1</div><span>Archivo</span></div>
      <div class="step-line" id="line1"></div>
      <div class="step" id="step2"><div class="num">2</div><span>QR</span></div>
      <div class="step-line" id="line2"></div>
      <div class="step" id="step3"><div class="num">3</div><span>Enviando</span></div>
      <div class="step-line" id="line3"></div>
      <div class="step" id="step4"><div class="num">4</div><span>Listo</span></div>
    </div>

    <!-- Step 1: File pick -->
    <div class="card" id="stepCard1">
      <label id="dropZone" for="fileInput">
        <div class="drop-icon">📂</div>
        <div class="drop-title">Arrastra tu archivo aquí</div>
        <div class="drop-sub">o haz clic para buscarlo</div>
      </label>
      <input type="file" id="fileInput" />

      <div id="filePill">
        <span class="pill-icon" id="pillIcon">📄</span>
        <div class="pill-info">
          <div class="pill-name" id="pillName"></div>
          <div class="pill-size" id="pillSize"></div>
        </div>
        <button class="pill-remove" id="btnRemoveFile" title="Quitar archivo">✕</button>
      </div>

      <button class="btn" id="btnShare" disabled>
        <span>Generar QR</span> <span>→</span>
      </button>
    </div>

    <!-- Step 2: QR shown -->
    <div id="qrSection">
      <div class="qr-label">📱 Escanea con el otro dispositivo</div>
      <div id="qrContainer"></div>
      <div class="qr-actions">
        <button class="btn-outline" id="btnCopyLink">📋 Copiar enlace</button>
        <button class="btn-outline" id="btnNewFile">🔄 Nuevo archivo</button>
      </div>
      <div id="qrUrl"></div>
    </div>

  </div>

  <!-- ── STATUS & PROGRESS ─────────────────────────── -->
  <div id="statusBar">
    <div id="statusMsg"></div>
    <div id="progressWrap">
      <div class="progress-header">
        <span class="progress-label" id="progressLabel">Enviando…</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div id="progressTrack"><div id="progressBar"></div></div>
      <div class="progress-speed" id="progressSpeed"></div>
    </div>
  </div>

  <!-- ── RECEIVER: waiting ─────────────────────────── -->
  <div id="receiverWaiting">
    <div class="card" style="align-items:center;display:flex;flex-direction:column;gap:1rem;text-align:center;">
      <div class="spinner"></div>
      <div class="waiting-title" id="waitingTitle">Conectando con el emisor…</div>
      <div class="waiting-sub" id="waitingSub">Esto solo toma unos segundos.</div>
    </div>
  </div>

  <!-- ── DOWNLOAD ──────────────────────────────────── -->
  <div id="downloadSection">
    <div class="card">
      <div class="dl-icon" id="dlIcon">📄</div>
      <div class="dl-filename" id="dlFilename"></div>
      <div class="dl-size" id="dlSize"></div>
      <a id="downloadLink" href="#">⬇️ Descargar</a>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
